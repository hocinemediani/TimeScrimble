<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Undefined</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    body {
        min-height: 100vh;
        background: var(--main-color);
        font-family: 'Balsamiq Sans', sans-serif;
        color: var(--text-color);
    }
    .game-code {
        margin-right: 2.5%;
        display: flex;
        flex-direction: row-reverse;
    }
    .main-content {
        width: 95%;
        margin-left: 2.5%;
    }
    .player-count-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 1%;
    }
    .main-container {
        display: flex;
        min-height: 80vh;
        max-height: 80vh;
        height: 100%;
        gap: 1%;
    }
    .play-container {
        display: flex;
        width: 100%;
    }
    .word-guess {
        padding: 0 max(25px, 2.5vw) 0 1%;
        position: absolute;
        bottom: 0;
        background-color: var(--blank-color);
        margin: 1%;
    }
    .word-guess-letter-count {
        font-size: 1rem;
        position: absolute;
        bottom: 0;
        right: 3%;
    }
    .player-name {
        font-size: 1rem;
    }
    .chat-text-header {
        font-size: 1.1rem;
        color: black;
    }
    .timer-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: fit-content;
    }
    .drawing-container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }
    .timer-image {
        width: 50%;
    }
    .side-bar {
        background-color: var(--secondary-color);
        width: max(10%, 100px);
        padding: 1%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .message-content {
        font-size: 0.9rem;
        padding-bottom: 5%;
    }
    .chat-content {
        padding-left: 1.5%;
    }
    .chat-container {
        width: 22%;
        background-color: var(--textbox-color);
        border-right: 3px dotted black;
        display: flex;
        flex-direction: column;
    }
    .messages-area {
        flex-grow: 1;
        overflow-y: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .chat-input {
        width: 90%;
        margin: 5%;
        flex-shrink: 0;
    }
    .correct {
        background-color: var(--success-color);
    }
    .chat-message {
        background-color: var(--accent-color);
        margin: 5% 5% 8% 5%;
        position: relative;
    }
    .chat-message::after {
        content: '';
        position: absolute;
        width: 0; 
        height: 0;
        left: 0;
        border-right: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 10px solid var(--accent-color);
    }
    .correct::after {
        content: '';
        position: absolute;
        width: 0; 
        height: 0;
        left: 0;
        z-index: 500;
        border-right: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 10px solid var(--success-color);
    }
    form {
        display: flex;
        width: 100%;
        gap: 2px;
        justify-content: space-between;
    }
    .player-count {
        font-weight: 500;
    }
    .guess-text {
        flex: 1;
        min-width: 0;
        font-family: 'Balsamiq sans', sans-serif;
        font-size: 1.2rem;
        height: 2rem;
        box-sizing: border-box;
        background-color: var(--blank-color);
        border: none;
    }
    .guess-submit {
        display: none;
    }
    .tool {
        width: min(60%, 60px);
        aspect-ratio: 1;
        margin-bottom: 5%;
        padding: 5%;
        border-radius: 10px;
        background-color: var(--other-color);
        background-size: 90%;
        background-repeat: no-repeat;
        background-position: center;
        border: none;
        cursor: pointer;
    }
    #eraser {
        background-image: url("/eraser.png");
    }
    #pencil {
        background-image: url("/pencil.png");
    }
    #bucket {
        background-image: url("/bucket.png")
    }
    .tools {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    input[type="submit"] {
        flex-shrink: 0; 
    }
    canvas {
        background-color: var(--textbox-color);
        max-width: 100%;
        aspect-ratio: 1200 / 900;
        overflow: hidden;
        cursor: crosshair;
        touch-action: none;
    }
    .colors {
        display: flex;
        flex-wrap: wrap;
    }
    .color-button {
        width: 32%;
        aspect-ratio: 1;
        border: 1px solid white;
        cursor: pointer;
    }
    #transition-manche {
        height: 100vh;
        width: 100%;
        display: none;
        opacity: 0.95;
        background-color: black;
        position: absolute;
        z-index: 9000;
    }
    #word-to-draw-container {
        width: 100%;
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -55%);
        margin: 0;
        text-align: center;
        color: white;
    }
    #word-was {
        width: 100%;
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -45%);
        margin: 0;
        text-align: center;
        color: white;
    }
    #ecran-fin {
        width: 100%;
        height: 100%;
        opacity: 0.97;
        background-color: black;
        position: absolute;
        z-index: 9000;
        display: none;
    }
    .score-text {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -48%);
        margin: 0;
        text-align: center;
        color: white;
    }
    .lobby-button {
        position: absolute;
        top: 59%;
        left: 50%;
        transform: translate(-50%, -59%);
        margin: 0;
        text-align: center;
        color: white;
        background-color: var(--accent-color);
        border: none;
        padding: 12px 20px;
        border-radius: 0.5rem;
        font-family: 'Balsamiq Sans', sans-serif;
        font-size: 1.3rem;
        cursor: pointer;
        transition: transform 0.1s;
    }
    .black {background-color: black;}
    .blue {background-color: blue;}
    .red {background-color: red;}
    .green {background-color: green;}
    .pink {background-color: pink;}
    .purple {background-color: purple;}
    .yellow {background-color: yellow;}
    .orange {background-color: orange;}
    .brown {background-color: brown;}
    .darkgreen {background-color: darkgreen;}
    .cyan {background-color: cyan;}
    .grey{background-color: grey;}
    
    @media (max-width: 775px) {
        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 45vh auto 30vh;
            gap: 1%;
            max-height: none;
            height: auto;
        }
        .play-container {
            display: contents;
        }
        .drawing-container {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
        }
        .side-bar {
            grid-column: 1;
            grid-row: 2;
            width: 100%;
            flex-direction: row; 
            align-items: center;
            justify-content: space-around;
            padding: 2%;
            box-sizing: border-box;
        }
        .tools-text, .colors-text {
            display: none;
        }
        .tools {
            flex-direction: row;
            gap: 10px;
        }
        .tool {
            width: 40px;
            margin-bottom: 0;
        }
        .colors {
            width: 160px;
            justify-content: center;
        }
        .color-button {
            width: 25px;
        }
        .timer-container {
            flex-direction: column;
        }
        
        .timer-image {
            width: 30px;
        }
        .chat-container {
            grid-column: 1;
            grid-row: 3;
            width: 100%;
            border: none;
        }
        .chat-input {
            margin: 0;
            width: 100%;
        }
        .chat-message {
            margin-top: 0 !important;
            margin-right: 0 !important;
            margin-bottom: 3% !important;
            margin-left: 0 !important;
        }
        .lobby-button {
            top: 80% !important;
            transform: translate(-50%, -80%) !important;
        }
    }
</style>
<body>
    <div id="ecran-fin">
        <h1 class="score-text" id="final-score">Congratulations ! Your score was : undefined</h1>
        <button class ="lobby-button" onclick="returnToLobby()">Return to the lobby</button>
    </div>
    <div id="transition-manche">
        <h1 id="word-was">The word was : undefined</h1>
        <h1 id="word-to-draw-container">You shouldn't be seeing this</h1>
    </div>
    <div class="game-code">
        <h1 class="game-code-text">Room's code : <span id="roomCode">undefined</span></h1>
    </div>
    <div class="main-content">
        <div class="player-count-container">
            <h1 class="player-count"><span id="playerCount">undefined</span> Players</h1>
            <button id="btn-start" onclick="startGame()" style="display: none; margin-top: 10px; padding: 5px 15px; cursor: pointer;">Start the game</button>
        </div>
        <div class="main-container"> 
            <div class="play-container">
                <div class="chat-container">
                    <div id="messages-area" class="messages-area">
                        <div class="chat-message">
                            <div class="chat-content">
                                <h1 class="player-name">Banshai (<span id="player1-points">878</span>pts)</h1>
                                <h1 class="message-content">La muraille de Chine</h1>
                            </div>
                        </div>
                        <div class="chat-message">
                            <div class="chat-content correct">
                                <h1 class="player-name">Hocine (<span id="player2-points">240</span>pts)</h1>
                                <h1 class="message-content">à trouvé la réponse !</h1>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input">
                        <h1 class="chat-text-header">Type your guess :</h1>
                        <form>
                            <input type="text" name="guess" class="guess-text" id="message">
                            <input type="hidden" name="code" value="xxxxxx">
                            <input type="submit" value=">" class="guess-submit" onclick="sendChatMessage(event)">
                        </form>
                    </div>
                </div>
                <div class="drawing-container">
                    <canvas id="canvas"></canvas>
                    <div class="word-guess">
                        <h1 class="word-guess-text">_ _ _ _ _ _ _ _</h1>
                        <h1 class="word-guess-letter-count">8</h1>
                    </div>
                </div>
            </div>
            <div class="side-bar">
                <div class="tools-container">
                    <h1 class="tools-text">Tools</h1>
                    <div class="tools">
                        <button class="tool" id="eraser" onclick="erase()"></button>
                        <button class="tool" id="pencil" onclick="pencil()"></button>
                        <button class="tool" id="bucket" onclick="bucket()"></button>
                    </div>
                </div>
                <div class="colors-container">
                    <h1 class="colors-text">Colors</h1>
                    <div class="colors">
                        <button class="color-button black" onclick="changeColor(this)"></button>
                        <button class="color-button blue" onclick="changeColor(this)"></button>
                        <button class="color-button red" onclick="changeColor(this)"></button>
                        <button class="color-button purple" onclick="changeColor(this)"></button>
                        <button class="color-button green" onclick="changeColor(this)"></button>
                        <button class="color-button yellow" onclick="changeColor(this)"></button>
                        <button class="color-button orange" onclick="changeColor(this)"></button>
                        <button class="color-button brown" onclick="changeColor(this)"></button>
                        <button class="color-button pink" onclick="changeColor(this)"></button>
                        <button class="color-button darkgreen" onclick="changeColor(this)"></button>
                        <button class="color-button cyan" onclick="changeColor(this)"></button>
                        <button class="color-button grey" onclick="changeColor(this)"></button>
                    </div>
                </div>
                <div class="timer-container">
                    <img class="timer-image" src="/timer.png" alt="Timer">
                    <h1 id="timer-text">_</h1>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    /* Etat du jeu. */
    let roomCode = new URLSearchParams(globalThis.location.search).get("code");
    let username = null;
    let playerCount = 0;
    let roomName = null;
    let firstTime = true;
    let segmentBuffer = [];

    // Socket et Canvas
    let socket = null;
    let stompClient = null;
    let canvas = null;
    let canvasContext = null;
    let previousColor = "black";

    /* Initialisation. */
    window.addEventListener('load', async () => {
        document.querySelectorAll('.chat-message').forEach(msg => msg.remove());
        
        await fetchUserInfo();
        await fetchRoomInfo();
        initCanvas();
        initWebSockets();
    });

    /* Gestion des informations. */
    async function fetchRoomInfo() {
        try {
            const response = await fetch("/roominfo?code=" + roomCode, { method: 'GET' });
            const infos = await response.json();
            
            document.getElementById("roomCode").innerText = roomCode;
            document.getElementById("playerCount").innerText = infos.playerCount;
            playerCount = infos.playerCount;
            roomName = infos.name;
            document.title = infos.name;
            if (username == infos.host && infos.statut == "attente") {
                document.getElementById("btn-start").style.display = "block";
            }
        } catch (error) {
            console.error("Problème lors de la récupération des informations de la room : ", error);
        }
    }

    async function fetchUserInfo() {
        try {
            const response = await fetch("/userinfo", { method: "GET", credentials: "include" });
            if (!response.ok) {
                globalThis.location.href = "/login";
                return;
            }
            const userInfos = await response.json();
            username = userInfos.username;
        } catch (error) {
            console.error("Problème de connexion à l'API : ", error);
        }
    }

    /* Gestion du websocket et des canaux. */
    function initWebSockets() {
        socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            console.log('Connexion au serveur WebSocket établie.');
            
            stompClient.send("/app/room/" + roomCode + "/chat", {}, JSON.stringify({
                pseudo: username, contenu: "", type: "JOIN"
            }));

            setupSubscriptions();

            stompClient.send("/app/room/" + roomCode + "/requestHistory", {}, username);

            startDrawingSyncLoop();
        });
    }

    function setupSubscriptions() {
        stompClient.subscribe('/topic/room/' + roomCode + '/draw', (msg) => {
            drawReceivedLines(JSON.parse(msg.body).lignes);
        });

        stompClient.subscribe('/topic/room/' + roomCode + '/status', (msg) => {
            handleStatusUpdate(JSON.parse(msg.body));
        });

        stompClient.subscribe('/topic/room/' + roomCode + '/secret/' + username, (msg) => {
            handleSecretUpdate(JSON.parse(msg.body));
        });

        stompClient.subscribe('/topic/room/' + roomCode + '/chat', (msg) => {
            handleMessage(JSON.parse(msg.body));
        });

        stompClient.subscribe('/topic/room/' + roomCode + '/requestDrawing/' + username, (msg) => {
            const history = JSON.parse(msg.body);
            history.forEach(drawMsg => drawReceivedLines(drawMsg.lignes));
        });
    }

    globalThis.addEventListener('DOMContentLoaded', () => {
        const entries = performance.getEntriesByType('navigation');
        const navType = entries.length > 0 ? entries[0].type : undefined;

        if (navType == 'reload') {
            console.log("Rechargement détecté pour la room :", roomCode);
            const formData = new FormData();
            formData.append('code', roomCode);
            fetch('/join', {
                method: 'POST',
                body: formData,
                credentials: "include"
            })
            .then(async (response) => {
                if (response.ok) {
                    console.log("Reconnexion réussie après refresh !");
                } else {
                    const errorMessage = await response.text();
                    alert("Impossible de vous reconnecter à la partie : " + errorMessage);
                    window.location.href = '/lobby'; 
                }
            })
            .catch(error => {
                console.error("Erreur réseau lors de la reconnexion :", error);
            });
        }
    });

    window.addEventListener('beforeunload', function () {
        if (stompClient && stompClient.connected) {
            try {
                stompClient.send("/app/room/" + roomCode + "/chat", {}, JSON.stringify({ pseudo: username, contenu: "", type: "LEAVE" }));
            } catch (e) {
                console.error('Impossible d\'envoyer LEAVE avant de quitter la page', e);
            }
        }
    });

    function startDrawingSyncLoop() {
        setInterval(() => {
            if (segmentBuffer.length > 0 && stompClient && stompClient.connected) {
                stompClient.send("/app/room/" + roomCode + "/draw", {}, JSON.stringify({
                    lignes: segmentBuffer,
                    pseudo: username
                }));
                segmentBuffer = [];
            }
        }, 100);
    }

    /* Traitement des événèments de la partie. */
    function handleStatusUpdate(data) {
        switch(data.type) {
            case "TIMER":
                document.getElementById("timer-text").innerText = data.contenu;
                break;
            case "FIN_PARTIE":
                document.getElementById("ecran-fin").style.display = "flex";
                break;
            case "FIN_MANCHE":
                afficherEcranTransition("The word was : " + data.contenu);
                break;
            case "DEBUT_MANCHE":
                preparerNouvelleManche();
                break;
        }

        if (data.type === "DEBUT_MANCHE" || data.hasOwnProperty('dessinateur')) {
            updateRolesUI(data);
        }
    }

    function handleSecretUpdate(data) {
        if (data.hasOwnProperty('score')) {
            document.getElementById("final-score").innerText = "Congratulations ! Your score was : " + data.score;
            document.getElementById("transition-manche").style.display = "none";
        } else if (data.hasOwnProperty('mot')) {
            document.querySelector(".word-guess-text").innerText = data.mot;
            document.getElementById("word-to-draw-container").innerText = "Your word is : " + data.mot;
        } else if (data.hasOwnProperty('host')) {
            if (username === data.host) {
                document.getElementById("btn-start").style.display = "block";
            } else {
                document.getElementById("btn-start").style.display = "none";
            }
        }
    }

    function updateRolesUI(data) {
        const isDessinateur = (data.dessinateur === username);
        const inputMessage = document.getElementById("message");
        
        canvas.style.pointerEvents = isDessinateur ? "auto" : "none";
        inputMessage.disabled = isDessinateur;
        inputMessage.placeholder = isDessinateur ? "You're drawing !" : "Type in your guess";
        
        document.querySelector(".word-guess-letter-count").innerText = data.tailleMot;

        if (!isDessinateur) {
            document.querySelector(".word-guess-text").innerText = "_ ".repeat(data.tailleMot);
            document.getElementById("word-to-draw-container").innerText = "You'll be guessing soon !";
        }
    }

    function preparerNouvelleManche() {
        canvasContext.clearRect(0, 0, canvas.width, canvas.height);
        if (firstTime) {
            firstTime = false;
            afficherEcranTransition("");
        }
        setTimeout(() => { document.getElementById("transition-manche").style.display = "none"; }, 2500);
    }

    function afficherEcranTransition(texteHaut) {
        document.getElementById("transition-manche").style.display = "block";
        document.getElementById("word-was").innerText = texteHaut;
    }

    /* Gestion de l'interface et du chat. */
    function handleMessage(data) {
        if (data.type === 'SUCCES' || data.type === 'CHAT') {
            addMessageToChat(data);
        } else if (data.type === 'JOIN' || data.type === 'LEAVE') {
            playerCount = data.contenu;
            document.getElementById("playerCount").innerText = playerCount;
        }
    }

    function addMessageToChat(data) {
        const messagesArea = document.getElementById('messages-area');
        
        const messageDiv = document.createElement('div');
        messageDiv.className = 'chat-message';
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'chat-content';
        if (data.type === 'SUCCES') contentDiv.classList.add('correct');
        
        const nameH1 = document.createElement('h1');
        nameH1.className = 'player-name';
        nameH1.textContent = data.pseudo;
        
        const textH1 = document.createElement('h1');
        textH1.className = 'message-content';
        textH1.textContent = data.contenu;
        
        contentDiv.appendChild(nameH1);
        contentDiv.appendChild(textH1);
        messageDiv.appendChild(contentDiv);
        messagesArea.appendChild(messageDiv);

        while (messagesArea.scrollHeight > messagesArea.clientHeight) {
            messagesArea.firstChild.remove();
        }
    }

    function sendChatMessage(event) {
        event.preventDefault();
        const inputField = document.getElementById("message");
        if (inputField.value.trim() === "") return;

        const messageToSend = {
            pseudo: username,
            contenu: inputField.value,
            type: "CHAT"
        };
        
        stompClient.send("/app/room/" + roomCode + "/chat", {}, JSON.stringify(messageToSend));
        inputField.value = "";
    }

    function startGame() {
        if (stompClient && stompClient.connected) {
            stompClient.send("/app/room/" + roomCode + "/start", {}, JSON.stringify({}));
            document.getElementById("btn-start").style.display = "none";
        }
    }

    function returnToLobby() {
        globalThis.location.href = "/lobby";
    }

    /* Gestion du canvas et du dessin. */
    function initCanvas() {
        canvas = document.getElementById("canvas");
        canvasContext = canvas.getContext("2d");
        
        canvas.style.pointerEvents = "none";
        canvas.width = 1200;
        canvas.height = 900;
        
        canvasContext.strokeStyle = previousColor;
        canvasContext.lineWidth = 5;
        canvasContext.lineCap = "round";

        let isDrawing = false;
        let xPos = 0, yPos = 0;

        function getCorrectPosition(mouseEvent) {
            const rect = canvas.getBoundingClientRect();
            return {
                xPos: (mouseEvent.clientX - rect.left) * canvas.width / rect.width,
                yPos: (mouseEvent.clientY - rect.top) * canvas.height / rect.height
            };
        }

        canvas.addEventListener("pointerdown", (e) => {
            const pos = getCorrectPosition(e);
            xPos = pos.xPos;
            yPos = pos.yPos;
            isDrawing = true;
        });

        canvas.addEventListener("pointermove", (e) => {
            if (!isDrawing) return;

            canvasContext.beginPath();
            canvasContext.moveTo(xPos, yPos);

            const lastX = xPos, lastY = yPos;
            const pos = getCorrectPosition(e);
            xPos = pos.xPos;
            yPos = pos.yPos;
            
            canvasContext.lineTo(xPos, yPos);
            canvasContext.stroke();
            canvasContext.closePath();
            
            segmentBuffer.push({
                x1: lastX, y1: lastY,
                x2: xPos, y2: yPos,
                couleur: canvasContext.strokeStyle,
                epaisseur: canvasContext.lineWidth
            });
        });

        const stopDrawing = () => { isDrawing = false; };
        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("pointerout", stopDrawing);
    }

    function drawReceivedLines(lines) {
        lines.forEach(segment => {
            canvasContext.beginPath();
            canvasContext.lineCap = "round";
            canvasContext.strokeStyle = segment.couleur;
            canvasContext.lineWidth = segment.epaisseur;
            canvasContext.moveTo(segment.x1, segment.y1);
            canvasContext.lineTo(segment.x2, segment.y2);
            canvasContext.stroke();
            canvasContext.closePath();
        });
    }

    /* Outils de dessin. */
    function erase() {
        if (canvasContext.strokeStyle !== "white" && canvasContext.strokeStyle !== "#ffffff" && canvasContext.strokeStyle !== "rgb(255, 255, 255)") {
            previousColor = canvasContext.strokeStyle;
        }
        canvasContext.strokeStyle = "white";
        canvasContext.lineWidth = 20;
    }

    function pencil() {
        canvasContext.strokeStyle = previousColor;
        canvasContext.lineWidth = 5;
    }

    function bucket() {
        canvasContext.clearRect(0, 0, canvas.width, canvas.height);
    }

    function changeColor(button) {
        const selectedColor = getComputedStyle(button).backgroundColor;
        canvasContext.strokeStyle = selectedColor;
        previousColor = selectedColor;
        canvasContext.lineWidth = 5;
    }
</script>
