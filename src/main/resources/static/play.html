<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Undefined</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    body {
        min-height: 100vh;
        background: var(--main-color);
        font-family: 'Balsamiq Sans', sans-serif;
        color: var(--text-color);
    }
    .game-code {
        margin-right: 2.5%;
        display: flex;
        flex-direction: row-reverse;
    }
    .main-content {
        width: 95%;
        margin-left: 2.5%;
    }
    .player-count-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 1%;
    }
    .main-container {
        display: flex;
        min-height: 80vh;
        max-height: 80vh;
        height: 100%;
        gap: 1%;
    }
    .play-container {
        display: flex;
        width: 100%;
    }
    .word-guess {
        padding: 0 max(25px, 2.5vw) 0 1%;
        position: absolute;
        bottom: 0;
        background-color: var(--blank-color);
        margin: 1%;
    }
    .word-guess-letter-count {
        font-size: 1rem;
        position: absolute;
        bottom: 0;
        right: 3%;
    }
    .player-name {
        font-size: 1rem;
    }
    .chat-text-header {
        font-size: 1.1rem;
        color: black;
    }
    .timer-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: fit-content;
    }
    .drawing-container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
    }
    .timer-image {
        width: 50%;
    }
    .side-bar {
        background-color: var(--secondary-color);
        width: max(10%, 100px);
        padding: 1%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .message-content {
        font-size: 0.9rem;
        padding-bottom: 5%;
    }
    .chat-content {
        padding-left: 1.5%;
    }
    .chat-container {
        width: 22%;
        background-color: var(--textbox-color);
        border-right: 3px dotted black;
        display: flex;
        flex-direction: column;
    }
    .messages-area {
        flex-grow: 1;
        overflow-y: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .chat-input {
        width: 90%;
        margin: 5%;
        flex-shrink: 0;
    }
    .correct {
        background-color: var(--success-color);
    }
    .chat-message {
        background-color: var(--accent-color);
        margin: 5% 5% 8% 5%;
        position: relative;
    }
    .chat-message::after {
        content: '';
        position: absolute;
        width: 0; 
        height: 0;
        left: 0;
        border-right: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 10px solid var(--accent-color);
    }
    .correct::after {
        content: '';
        position: absolute;
        width: 0; 
        height: 0;
        left: 0;
        z-index: 500;
        border-right: 10px solid transparent;
        border-bottom: 10px solid transparent;
        border-left: 10px solid var(--success-color);
    }
    form {
        display: flex;
        width: 100%;
        gap: 2px;
        justify-content: space-between;
    }
    .player-count {
        font-weight: 500;
    }
    .guess-text {
        flex: 1;
        min-width: 0;
        font-family: 'Balsamiq sans', sans-serif;
        font-size: 1.2rem;
        height: 2rem;
        box-sizing: border-box;
        background-color: var(--blank-color);
        border: none;
    }
    .guess-submit {
        display: none;
    }
    .tool {
        width: min(60%, 60px);
        aspect-ratio: 1;
        margin-bottom: 5%;
        padding: 5%;
        border-radius: 10px;
        background-color: var(--other-color);
        background-size: 90%;
        background-repeat: no-repeat;
        background-position: center;
        border: none;
        cursor: pointer;
    }
    #eraser {
        background-image: url("/eraser.png");
    }
    #pencil {
        background-image: url("/pencil.png");
    }
    #bucket {
        background-image: url("/bucket.png")
    }
    .tools {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    input[type="submit"] {
        flex-shrink: 0; 
    }
    canvas {
        background-color: var(--textbox-color);
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
    }
    .colors {
        display: flex;
        flex-wrap: wrap;
    }
    .color-button {
        width: 32%;
        aspect-ratio: 1;
        border: 1px solid white;
        cursor: pointer;
    }
    #transition-manche {
        height: 100%;
        width: 100%;
        display: none;
        opacity: 0.95;
        background-color: black;
        position: absolute;
        z-index: 9000;
    }
    #word-to-draw-container {
        position: absolute;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -52%);
        margin: 0;
        text-align: center;
        color: white;
    }
    #word-was {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -48%);
        margin: 0;
        text-align: center;
        color: white;
    }
    #ecran-fin {
        width: 100%;
        height: 100%;
        opacity: 0.97;
        background-color: black;
        position: absolute;
        z-index: 9000;
        display: none;
    }
    .score-text {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -48%);
        margin: 0;
        text-align: center;
        color: white;
    }
    .lobby-button {
        position: absolute;
        top: 59%;
        left: 50%;
        transform: translate(-50%, -59%);
        margin: 0;
        text-align: center;
        color: white;
        background-color: var(--accent-color);
        border: none;
        padding: 12px 20px;
        border-radius: 0.5rem;
        font-family: 'Balsamiq Sans', sans-serif;
        font-size: 1.3rem;
        cursor: pointer;
        transition: transform 0.1s;
    }
    .black {background-color: black;}
    .blue {background-color: blue;}
    .red {background-color: red;}
    .green {background-color: green;}
    .pink {background-color: pink;}
    .purple {background-color: purple;}
    .yellow {background-color: yellow;}
    .orange {background-color: orange;}
    .brown {background-color: brown;}
    .darkgreen {background-color: darkgreen;}
    .cyan {background-color: cyan;}
    .grey{background-color: grey;}
</style>
<body>
    <div id="ecran-fin">
        <!-- il faudrait faire l'ecran de fin ici. -->
        <h1 class="score-text" id="final-score">Congratulations ! Your score was : undefined</h1>
        <button class ="lobby-button" onclick="returnToLobby()">Return to the lobby</button>
    </div>
    <div id="transition-manche">
        <h1 id="word-was">The word was : undefined</h1>
        <h1 id="word-to-draw-container">You shouldn't be seeing this</h1>
    </div>
    <div class="game-code">
        <h1 class="game-code-text">Room's code : <span id="roomCode">undefined</span></h1>
    </div>
    <div class="main-content">
        <div class="player-count-container">
            <h1 class="player-count"><span id="playerCount">undefined</span> Players</h1>
            <!-- Bouton de merde, a changer quand l'écran de la maquette sera fait. -->
            <button id="btn-start" onclick="startGame()" style="display: none; margin-top: 10px; padding: 5px 15px; cursor: pointer;">Start the game</button>
        </div>
        <div class="main-container"> 
            <div class="play-container">
                <div class="chat-container">
                    <div id="messages-area" class="messages-area">
                        <div class="chat-message">
                            <div class="chat-content">
                                <h1 class="player-name">Banshai (<span id="player1-points">878</span>pts)</h1>
                                <h1 class="message-content">La muraille de Chine</h1>
                            </div>
                        </div>
                        <div class="chat-message">
                            <div class="chat-content correct">
                                <h1 class="player-name">Hocine (<span id="player2-points">240</span>pts)</h1>
                                <h1 class="message-content">à trouvé la réponse !</h1>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input">
                        <h1 class="chat-text-header">Type your guess :</h1>
                        <form>
                            <input type="text" name="guess" class="guess-text" id="message">
                            <input type="hidden" name="code" value="xxxxxx">
                            <input type="submit" value=">" class="guess-submit" onclick="sendChatMessage(event)">
                        </form>
                    </div>
                </div>
                <div class="drawing-container">
                    <canvas id="canvas"></canvas>
                    <div class="word-guess">
                        <h1 class="word-guess-text">_ _ _ _ _ _ _ _</h1>
                        <h1 class="word-guess-letter-count">8</h1>
                    </div>
                </div>
            </div>
            <div class="side-bar">
                <div class="tools-container">
                    <h1 class="tools-text">Tools</h1>
                    <div class="tools">
                        <button class="tool" id="eraser" onclick="erase()" onKeyDown="erase()"></button>
                        <button class="tool" id="pencil" onclick="pencil()" onKeyDown="pencil()"></button>
                        <button class="tool" id="bucket" onclick="bucket()" onKeyDown="bucket()"></button>
                    </div>
                </div>
                <div class="colors-container">
                    <h1 class="colors-text">Colors</h1>
                    <div class="colors">
                        <button class="color-button black" onclick="changeColor(this)"></button>
                        <button class="color-button blue" onclick="changeColor(this)"></button>
                        <button class="color-button red" onclick="changeColor(this)"></button>
                        <button class="color-button purple" onclick="changeColor(this)"></button>
                        <button class="color-button green" onclick="changeColor(this)"></button>
                        <button class="color-button yellow" onclick="changeColor(this)"></button>
                        <button class="color-button orange" onclick="changeColor(this)"></button>
                        <button class="color-button brown" onclick="changeColor(this)"></button>
                        <button class="color-button pink" onclick="changeColor(this)"></button>
                        <button class="color-button darkgreen" onclick="changeColor(this)"></button>
                        <button class="color-button cyan" onclick="changeColor(this)"></button>
                        <button class="color-button grey" onclick="changeColor(this)"></button>
                    </div>
                </div>
                <div class="timer-container">
                    <img class="timer-image" src="/timer.png" alt="Timer">
                    <h1 id="timer-text">46</h1>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    /* Initialisation */
    let roomCode;
    let username;
    let playerCount;
    let segmentBuffer = [];
    let roomName;
    document.querySelectorAll('.chat-message').forEach(msg => msg.remove());
    async function fetchRoomInfo() {
        roomCode = new URLSearchParams(globalThis.location.search).get("code");
        let fullURL = "/roominfo"+ "?code=" + roomCode;
        try {
            let response = await fetch(fullURL, {
                method: 'GET'
            });
            let infos = await response.json();
            document.getElementById("roomCode").innerText = roomCode;
            document.getElementById("playerCount").innerText = infos.playerCount;
            playerCount = infos.playerCount
            if (playerCount <= 1) {
                document.getElementById("btn-start").style.display = "block";
            }
            roomName = infos.name;
            document.title = infos.name;
        } catch (error) {
            console.error("Problème lors de la récupération des informations de la room : ", error);
        }
    }
    fetchRoomInfo();
    function returnToLobby() {
        globalThis.location.href = "/lobby";
    }
    async function fetchUserInfo() {
        try {
            const infos = await fetch("/userinfo", {
                method: "GET",
                credentials: "include"
            });
            if (!infos.ok) {
                console.error("GROS PROBLEME !!! Statut HTTP :", infos.status);
                globalThis.location.href = "/login";
                return;
            }
            const userInfos = await infos.json();
            username = userInfos.username;
        } catch (error) {
            console.error("Problème de connexion à l'API : ", error)
        }
    }
    fetchUserInfo();

    /* Dessin sur canvas. */
    let canvas = document.getElementById("canvas");
    let canvasContext = canvas.getContext("2d");
    let previousColor;
    function erase() {
        previousColor = canvasContext.strokeStyle;
        canvasContext.strokeStyle = "white";
        canvasContext.lineWidth = 20;
    }
    function pencil() {
        canvasContext.strokeStyle = previousColor;
        canvasContext.lineWidth = 5;
    }
    function bucket() {
        
    }
    function changeColor(button) {
        canvasContext.lineWidth = 5;
        canvasContext.strokeStyle = getComputedStyle(button).backgroundColor;
        console.log(getComputedStyle(button).backgroundColor);
    }
    function drawReceivedLines(lines) {
        lines.forEach(segment => {
            canvasContext.beginPath();
            canvasContext.strokeStyle = segment.couleur;
            canvasContext.lineWidth = segment.epaisseur;
            canvasContext.moveTo(segment.x1, segment.y1);
            canvasContext.lineTo(segment.x2, segment.y2);
            canvasContext.stroke();
        });
    }
    window.addEventListener('load', function() {
        canvas.style.pointerEvents = "none";
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        canvasContext.strokeStyle = "black";
        canvasContext.lineWidth = 5;
        let isDrawing = false;
        let xPos = 0;
        let yPos = 0;
        function getCorrectPosition(mouseEvent) {
            let rectangle = canvas.getBoundingClientRect();
            return {
                xPos: (mouseEvent.clientX - rectangle.left) * canvas.width / rectangle.width,
                yPos: (mouseEvent.clientY - rectangle.top) * canvas.height / rectangle.height
            };
        }
        function initialiseMouse(mouseEvent) {
            let position = getCorrectPosition(mouseEvent);
            xPos = position.xPos;
            yPos = position.yPos;
            isDrawing = true;
        }
        function draw(mouseEvent) {
            if (!isDrawing) {
                return;
            }
            canvasContext.beginPath();
            canvasContext.lineCap = "round";
            canvasContext.moveTo(xPos, yPos);
            let [lastX, lastY] = [xPos, yPos];
            let position = getCorrectPosition(mouseEvent);
            xPos = position.xPos;
            yPos = position.yPos; 
            canvasContext.lineTo(xPos, yPos);
            canvasContext.stroke();
            canvasContext.closePath();
            segmentBuffer.push({
                x1: lastX,
                y1: lastY,
                x2: xPos,
                y2: yPos,
                couleur: canvasContext.strokeStyle,
                epaisseur: canvasContext.lineWidth
            });
        }
        function endDrawing(mouseEvent) {
            draw(mouseEvent);
            xPos = 0;
            yPos = 0;
            isDrawing = false;
        }
        canvas.addEventListener("mousedown", initialiseMouse);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", endDrawing);
    });
    
    /* Connexion socket pour chat et traits. */
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.connect({}, function (frame) {
        console.log('Connection au serveur établie.');
        const joinMessage = {
            pseudo: username,
            contenu: "",
            type: "JOIN"
        };
        stompClient.send("/app/room/" + roomCode + "/chat", {}, JSON.stringify(joinMessage));
        stompClient.subscribe('/topic/room/' + roomCode + '/draw', function (msg) {
            const data = JSON.parse(msg.body);
            drawReceivedLines(data.lignes);
        });

        /* Pour traiter le début et la fin (afficher les écrans et changer la logique). */
        stompClient.subscribe('/topic/room/' + roomCode + '/status', function(msg) {
            handleStatusUpdate(JSON.parse(msg.body));
        });
        stompClient.subscribe('/topic/room/' + roomCode + '/secret/' + username, function(msg) {
            const data = JSON.parse(msg.body);
            if (data.hasOwnProperty('score')) {
                document.getElementById("final-score").innerText = "Congratulations ! Your score was : " + data.score;
                document.getElementById("transition-manche").style.display = "none";
                return;
            }
            document.querySelector(".word-guess-text").innerText = data.mot;
            document.getElementById("word-to-draw-container").innerText = "Your word is : " + data.mot;
        });
        stompClient.subscribe('/topic/room/' + roomCode + '/chat', function (message) {
            const data = JSON.parse(message.body);
            handleMessage(data);
        });
        stompClient.subscribe('/topic/room/' + roomCode + '/requestDrawing/' + username, function (msg) {
            const history = JSON.parse(msg.body);
            history.forEach(drawMsg => {
                drawReceivedLines(drawMsg.lignes);
            });
        });
        stompClient.send("/app/room/" + roomCode + "/requestHistory", {}, username);
    });
    function handleStatusUpdate(data) {
        if (data.type == "TIMER") {
            document.getElementById("timer-text").innerText = data.contenu;
            return;
        }
        if (data.type == "FIN_PARTIE") {
            document.getElementById("ecran-fin").style.display = "flex";
            return;
        }
        if (data.type == "DEBUT_MANCHE") {
            canvasContext.clearRect(0, 0, canvas.width, canvas.height);
            setTimeout(() => {document.getElementById("transition-manche").style.display = "none";}, 2500);
        }
        if (data.type == "FIN_MANCHE") {
            document.getElementById("transition-manche").style.display = "block";
            document.getElementById("word-was").innerText = "The word was : " + data.contenu;
        }
        const isDessinateur = (data.dessinateur == username);
        canvas.style.pointerEvents = isDessinateur ? "auto" : "none";
        document.getElementById("message").disabled = isDessinateur;
        document.getElementById("message").placeholder = isDessinateur ? "You're drawing !" : "Type in your guess";
        if (!isDessinateur) {
            document.querySelector(".word-guess-text").innerText = "_ ".repeat(data.tailleMot);
            document.getElementById("word-to-draw-container").innerText = "You'll be guessing soon !";
        }
        document.querySelector(".word-guess-letter-count").innerText = data.tailleMot;
    }
    function handleMessage(data) {
        if (data.type == 'SUCCES' || data.type == 'CHAT') {
            addMessageToChat(data);
        }
        if (data.type == 'JOIN' || data.type == 'LEAVE') {
            playerCount = data.contenu;
            document.getElementById("playerCount").innerText = playerCount;
        }
    }
    function addMessageToChat(data) {
        const messagesArea = document.getElementById('messages-area');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'chat-message';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'chat-content';
        if (data.type == 'SUCCES') {
            contentDiv.classList.add('correct');
        }
        const nameH1 = document.createElement('h1');
        nameH1.className = 'player-name';
        nameH1.textContent = data.pseudo;
        const textH1 = document.createElement('h1');
        textH1.className = 'message-content';
        textH1.textContent = data.contenu;
        contentDiv.appendChild(nameH1);
        contentDiv.appendChild(textH1);
        messageDiv.appendChild(contentDiv);
        messagesArea.appendChild(messageDiv);
        while (messagesArea.scrollHeight > messagesArea.clientHeight) {
            messagesArea.firstChild.remove();
        }
    }
    function sendChatMessage() {
        event.preventDefault();
        const messageToSend = {
            pseudo: username,
            contenu: document.getElementById("message").value,
            type: "CHAT"
        };
        stompClient.send("/app/room/" + roomCode + "/chat", {}, JSON.stringify(messageToSend));
        document.getElementById("message").value = "";
    }
    function startGame() {
        if (stompClient && stompClient.connected) {
            stompClient.send("/app/room/" + roomCode + "/start", {}, JSON.stringify({}));
            document.getElementById("btn-start").style.display = "none";
        }
    }

    /* Envoi des tracés. */
    setInterval(() => {
        if (segmentBuffer.length > 0 && stompClient && stompClient.connected) {
            stompClient.send("/app/room/" + roomCode + "/draw", {}, JSON.stringify({
                lignes: segmentBuffer,
                pseudo: username}));
            segmentBuffer = [];
        }
    }, 100);
</script>
</html>
